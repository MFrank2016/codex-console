{% extends "_workspace_base.html" %}

{% block page_content %}
<div class="experiment-dashboard analysis-dashboard retro-dashboard">
    <section class="workspace-panel analysis-toolbar-panel retro-page-header">
        <div class="page-head-actions analysis-panel-head">
            <div>
                <h3>实验对比 + 存活看板</h3>
                <p class="panel-subtitle">输入实验批次 ID，查看实验概览、步骤对比与存活统计。</p>
            </div>
        </div>

        <div class="form-row experiment-toolbar">
            <div class="form-group">
                <label for="experiment-id-input">实验批次 ID</label>
                <input type="number" id="experiment-id-input" min="1" placeholder="输入实验 ID">
            </div>
            <div class="form-group experiment-toolbar-actions">
                <label>&nbsp;</label>
                <button type="button" class="btn btn-primary" id="load-experiment-btn">加载看板</button>
            </div>
        </div>
    </section>

    <section class="workspace-panel analysis-summary-panel retro-summary-panel" data-retro-section="summary">
        <div class="page-head-actions analysis-panel-head">
            <div>
                <h3>实验概览</h3>
                <p class="panel-subtitle">汇总当前流水线、任务规模与关键实验指标。</p>
            </div>
        </div>
        <div class="experiment-summary-grid retro-summary-grid" id="experiment-summary"></div>
    </section>

    <div class="analysis-dual-grid retro-analysis-grid" data-retro-section="analysis">
        <section class="workspace-panel analysis-content-panel">
            <div class="page-head-actions analysis-panel-head">
                <div>
                    <h3>步骤对比</h3>
                    <p class="panel-subtitle">对比实验批次中各步骤的成功率、耗时与执行表现。</p>
                </div>
            </div>
            <div id="experiment-step-compare"></div>
        </section>

        <section class="workspace-panel analysis-content-panel">
            <div class="page-head-actions analysis-panel-head">
                <div>
                    <h3>存活摘要</h3>
                    <p class="panel-subtitle">查看实验批次关联账号的健康状态与存活分布。</p>
                </div>
            </div>
            <div class="survival-summary-grid" id="survival-summary"></div>
        </section>
    </div>
</div>
{% endblock %}

{% block page_scripts %}
<script src="/static/js/utils.js?v={{ static_version }}"></script>
<script src="/static/js/registration_experiments.js?v={{ static_version }}"></script>
{% endblock %}
