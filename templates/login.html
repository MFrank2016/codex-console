<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>访问验证 - OpenAI 注册系统</title>
    <link rel="stylesheet" href="/static/css/style.css?v={{ static_version }}">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔒</text></svg>">
</head>
<body class="login-page">
    <main class="login-shell">
        <section class="login-card warm-surface">
            <div class="login-card-copy">
                <span class="login-badge">🔒 访问验证</span>
                <h1 class="login-title">进入控制台</h1>
                <p class="login-subtitle">请输入访问密码继续使用工作区界面。</p>
            </div>

            {% if error %}
            <div class="login-error">{{ error }}</div>
            {% endif %}

            <form id="login-form" method="post" action="/login">
                <input type="hidden" name="next" value="{{ next }}">
                <div class="form-group">
                    <label for="password">访问密码</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" required autofocus>
                </div>
                <div class="form-actions login-actions">
                    <button type="submit" class="btn btn-primary">验证进入</button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
