{% extends "_workspace_base.html" %}

{% block page_content %}
<div class="batch-stats-dashboard analysis-dashboard">
    <section class="workspace-panel analysis-toolbar-panel">
        <div class="page-head-actions analysis-panel-head">
            <div>
                <h3>注册批次统计</h3>
                <p class="panel-subtitle">浏览批次列表，按单批次查看详情，或选择两个批次进行对比。</p>
            </div>
        </div>
    </section>

    <div class="batch-stats-layout">
        <section class="workspace-panel batch-stats-list analysis-content-panel">
            <div class="page-head-actions analysis-panel-head">
                <div>
                    <h3>批次列表</h3>
                    <p class="panel-subtitle">选择一个批次查看详情，选择两个批次生成对比。</p>
                </div>
            </div>
            <div id="batch-stats-list"></div>
        </section>

        <section class="workspace-panel batch-stats-detail analysis-content-panel">
            <div class="page-head-actions analysis-panel-head">
                <div>
                    <h3>批次详情</h3>
                    <p class="panel-subtitle">查看当前所选批次的指标、摘要与步骤表现。</p>
                </div>
            </div>
            <div id="batch-stats-detail"></div>
        </section>

        <section class="workspace-panel batch-stats-compare analysis-content-panel" id="batch-compare-panel">
            <div class="page-head-actions analysis-panel-head">
                <div>
                    <h3>批次对比</h3>
                    <p class="panel-subtitle">并排比较两个批次的成功率、目标量与耗时差异。</p>
                </div>
            </div>
            <div id="batch-stats-compare"></div>
        </section>
    </div>
</div>
{% endblock %}

{% block page_scripts %}
<script src="/static/js/utils.js?v={{ static_version }}"></script>
<script src="/static/js/registration_batch_stats.js?v={{ static_version }}"></script>
{% endblock %}
