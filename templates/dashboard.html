{% extends "_workspace_base.html" %}

{% block head_extra %}
<link rel="stylesheet" href="/static/css/dashboard_page.css?v={{ static_version }}">
{% endblock %}

{% block page_content %}
<section class="dashboard-page dashboard-overview-hub">
  <header class="dashboard-overview-head">
    <h2 class="dashboard-overview-title">Dashboard 启动台</h2>
    <p class="dashboard-overview-subtitle">在一个页面内查看摘要、提醒和常用入口。</p>
  </header>

  <div class="dashboard-overview-grid">
    <section class="dashboard-overview-section">
      <header class="dashboard-overview-section-head">
        <h3 class="dashboard-overview-section-title">总览摘要</h3>
      </header>
      <div id="dashboard-overview-summary" class="dashboard-overview-summary-grid" aria-live="polite"></div>
    </section>

    <section class="dashboard-overview-section">
      <header class="dashboard-overview-section-head">
        <h3 class="dashboard-overview-section-title">提醒与动态</h3>
      </header>
      <ul id="dashboard-overview-alerts" class="dashboard-overview-alerts" aria-live="polite"></ul>
    </section>
  </div>

  <section class="dashboard-overview-section dashboard-overview-launchpad-section">
    <header class="dashboard-overview-section-head">
      <h3 class="dashboard-overview-section-title">启动台入口</h3>
    </header>
    <div id="dashboard-overview-launchpad" class="dashboard-launchpad-grid" aria-live="polite"></div>
  </section>
</section>
{% endblock %}

{% block page_scripts %}
<script src="{{ '/static/js/dashboard.js?v=' ~ static_version }}"></script>
{% endblock %}
