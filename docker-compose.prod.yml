services:
  db:
    image: postgres:16-alpine
    container_name: codex-console-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  webui:
    build:
      context: .
    image: codex-console:prod
    container_name: codex-console
    depends_on:
      db:
        condition: service_healthy
    environment:
      WEBUI_HOST: 0.0.0.0
      WEBUI_PORT: 1455
      WEBUI_ACCESS_PASSWORD: ${WEBUI_ACCESS_PASSWORD}
      APP_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      LOG_LEVEL: info
      DEBUG: "0"
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "127.0.0.1:1455:1455"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped

volumes:
  postgres_data:
